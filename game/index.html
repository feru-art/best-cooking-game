<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Lightning Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d16; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none;
          width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); background: #f7e8d0; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Dapur Kilat: a fast cooking game. Take orders, chop and cook ingredients, plate dishes and serve them before customers lose patience."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
